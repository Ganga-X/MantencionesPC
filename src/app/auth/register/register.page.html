<ion-content class="auth-content"><main class="auth-shell"><p class="eyebrow">Nueva cuenta</p><h1>Comencemos.</h1><p class="intro">Registra tus datos para solicitar y seguir tus mantenciones.</p><form [formGroup]="form" (ngSubmit)="submit()"><ion-item><ion-input label="Nombre completo" labelPlacement="stacked" formControlName="name"></ion-input></ion-item><ion-item><ion-input label="Correo electrónico" labelPlacement="stacked" type="email" formControlName="email"></ion-input></ion-item><ion-item><ion-input label="WhatsApp" labelPlacement="stacked" type="tel" formControlName="whatsapp"></ion-input></ion-item><ion-item><ion-input label="Contraseña" labelPlacement="stacked" type="password" formControlName="password"></ion-input></ion-item>@if (error) { <ion-text color="danger"><p>{{ error }}</p></ion-text> }<ion-button expand="block" type="submit" [disabled]="loading">{{ loading ? 'Creando...' : 'Crear cuenta' }}</ion-button></form><ion-button expand="block" fill="clear" routerLink="/login">Ya tengo una cuenta</ion-button></main></ion-content>
