<ion-content class="auth-content"><div class="retro-scene" [class]="'retro-scene ' + retroTheme" aria-hidden="true"><div class="retro-sun"></div><div class="retro-grid"></div><div class="retro-pixels"></div></div><ion-button class="back-button" fill="clear" routerLink="/login" aria-label="Volver al inicio"><span aria-hidden="true">←</span></ion-button><main class="auth-shell"><p class="eyebrow">Nueva cuenta</p><p class="intro">Registra tus datos para solicitar y seguir tus mantenciones.</p><form [formGroup]="form" (ngSubmit)="submit()"><label for="name">Nombre completo</label><ion-item><ion-input id="name" formControlName="name"></ion-input></ion-item><label for="email">Correo electrónico</label><ion-item><ion-input id="email" type="email" formControlName="email"></ion-input></ion-item><label for="whatsapp">WhatsApp</label><ion-item><ion-input id="whatsapp" type="tel" formControlName="whatsapp"></ion-input></ion-item><label for="password">Contraseña</label><ion-item><ion-input id="password" type="password" formControlName="password"></ion-input></ion-item>@if (error) { <ion-text color="danger"><p>{{ error }}</p></ion-text> }<ion-button expand="block" type="submit" [disabled]="loading">{{ loading ? 'Creando...' : 'Crear cuenta' }}</ion-button></form><ion-button expand="block" fill="clear" routerLink="/login">Ya tengo una cuenta</ion-button></main></ion-content>
