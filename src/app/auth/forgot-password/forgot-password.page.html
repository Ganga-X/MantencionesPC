<ion-content class="auth-content"><main class="auth-shell"><p class="eyebrow">Recuperar acceso</p><h1>Restablece tu contraseña.</h1><p class="intro">Te enviaremos un enlace al correo asociado a tu cuenta.</p><form [formGroup]="form" (ngSubmit)="submit()"><ion-item><ion-input label="Correo electrónico" labelPlacement="stacked" type="email" formControlName="email"></ion-input></ion-item>@if (error) { <ion-text color="danger"><p>{{ error }}</p></ion-text> }@if (sent) { <ion-text color="success"><p>Revisa tu bandeja de entrada para continuar.</p></ion-text> }<ion-button expand="block" type="submit">Enviar enlace</ion-button></form><ion-button expand="block" fill="clear" routerLink="/login">Volver al inicio de sesión</ion-button></main></ion-content>
